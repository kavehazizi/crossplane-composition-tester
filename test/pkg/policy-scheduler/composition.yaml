apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpolicyscheduler.aws.example.com
spec:
  compositeTypeRef:
    apiVersion: policyscheduler.example.com/v1alpha1
    kind: XPolicyScheduler
  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: envconfig
  - functionRef:
      name: function-go-templating
    step: sample-step-1
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |-
          {{ $accountId := (index .context "apiextensions.crossplane.io/environment").accountId }}
          {{ $now := dateInZone "2006-01-02T15:04:05Z" now "UTC" }}

          {{ range $index, $schedule := .observed.composite.resource.spec.schedules }}
          {{ if and (le $schedule.scheduleFrom $now) (ge $schedule.scheduleUntil $now) }}
          ---
          apiVersion: iam.aws.crossplane.io/v1beta1
          kind: Role
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: role-{{ $index }}
            name: {{ $schedule.roleName }}
          spec:
            forProvider:
              assumeRolePolicyDocument: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "AWS": "arn:aws:iam::{{ $accountId }}:root"
                      },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }
            providerConfigRef:
              name: providerconfig-aws
          {{ end }}
          {{ end }}
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: function-auto-ready
